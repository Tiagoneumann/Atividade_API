<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css">
    <link rel="stylesheet" href="style.css">
    <title>API - Rick and Morty</title>


    <script src="main.js" defer></script>
</head>
<body>
    <header>
        <nav class="navbar">
            <h3>Rick and Morty</h3>


            <form id="pesquisa">
                <label for="barra_de_pesquisa"><i class="fa-solid fa-magnifying-glass"></i></label>
                <input type="text" id="barra_de_pesquisa" class="barra_de_pesquisa" name="barra_de_pesquisa" placeholder="Digite o nome de um personagem">
                <button type="submit">Pesquisar</button>
            </form>
           
        </nav>
    </header>
    <main>
        <div class="container">
            <h1 id="nome_personagem"></h1>


            <div class="separacao">
                <img id="foto">


                <div class="informacoes">
                    <ul id="aba_informacoes">
                    </ul>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
