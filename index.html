<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css">
    <link rel="stylesheet" href="style.css">
    <title>API - Rick and Morty</title>
</head>
<body>
    <header>
        <nav class="navbar">
            <h3>Rick and Morty API</h3>

            <form id="pesquisa">
                <label for="barra_de_pesquisa"><i class="fa-solid fa-magnifying-glass"></i></label>
                <input type="text" id="barra_de_pesquisa" name="barra_de_pesquisa" placeholder="Digite o nome de um personagem">
                <input type="submit">
            </form>
            
        </nav>
    </header>
    <main>
        <div class="container">
            <h1 id="nome_personagem"></h1>

            <img src="" alt="imagem do personagem">

            <div class="informacoes">
                <h4>Nome: </h4>
                <h4>Status: </h4>
                <h4>Espécie: </h4>
                <h4>Tipo: </h4>
                <h4>Gênero: </h4>
                <h4>Origem: </h4>
                <h4>Localização: </h4>
                <h4>Episodio: </h4>
                <h4>Criação: </h4>
            </div>
        </div>
    </main>
</body>
</html>
